<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Plantar · En vivo</title><link rel="icon" href="icon.svg">
<style>
:root{--bg:#f4f6f4;--card:#fff;--tx:#1d2420;--mut:#6b746f;--ln:#e2e7e3;--vd:#008760;--vo:#013B27;--chip:#e8f3ee}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18201c;--tx:#e9eeeb;--mut:#9aa59f;--ln:#2a342f;--chip:#1d2d25}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--vo);color:#fff;padding:18px 16px 22px}
header .t{font-size:14px;opacity:.85}header .n{font-size:56px;font-weight:800;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
header .s{font-size:14px;opacity:.85}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ddc84;margin-right:6px;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
.r{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:10px}
.r .a{font-weight:600}.r .b{color:var(--mut);font-size:13px;margin-top:2px}
.chip{display:inline-block;background:var(--chip);color:var(--vd);border-radius:20px;padding:1px 8px;font-size:12px;font-weight:600;margin-left:6px}
.vac{color:var(--mut);text-align:center;padding:40px 10px}
.err{background:#fdecea;color:#8a1c12;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
</style></head><body>
<header><div class="t"><span class="dot"></span>Plantar · App de clientes en vivo</div><div class="n" id="n">–</div><div class="s" id="s">Cargando…</div></header>
<main id="m"></main>
<script>
const GAS='https://script.google.com/macros/s/AKfycbwwj1Hi1BuHeQQrCduhzw5U_xBuPCE4ywHfBXFF7IngNruuPItblSNok9pzbsegEtN9/exec';
const VISTA={cat:'Mirando el catálogo',car:'En el carrito',mis:'En Mis compras',dat:'En Mis datos'};
let K=new URLSearchParams(location.search).get('k')||'';
try{if(K)localStorage.setItem('pl_vivo',K);else K=localStorage.getItem('pl_vivo')||''}catch(e){}
if(K&&location.search)history.replaceState(null,'',location.pathname);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hace=s=>s<60?'hace '+s+' s':'hace '+Math.round(s/60)+' min';
async function cargar(){const m=document.getElementById('m');
  if(!K){m.innerHTML='<div class="err">Falta la clave. Abrí el link completo que te pasó Claude.</div>';document.getElementById('s').textContent='';return}
  try{const r=await fetch(GAS+'?k='+encodeURIComponent(K)+'&_='+Date.now(),{credentials:'omit'}).then(r=>r.json());
    if(!r.vivos){m.innerHTML='<div class="err">Clave incorrecta.</div>';return}
    const v=r.vivos;document.getElementById('n').textContent=v.length;
    document.getElementById('s').textContent=(v.length===1?'persona usando la app ahora':'personas usando la app ahora')+' · se actualiza solo';
    m.innerHTML=v.length?v.map(x=>{const que=x.p?'Viendo: '+esc(x.pn||x.p)+' <span style="color:var(--mut)">('+esc(x.p)+')</span>':x.q?'Buscando “'+esc(x.q)+'”':esc(VISTA[x.v]||'Abrió la app');
      return '<div class="r"><div class="a">'+que+(x.n?'<span class="chip">🛒 '+x.n+'</span>':'')+'</div><div class="b">'+(x.cli?esc(x.cli)+' · ':'Visitante · ')+(x.mob?'Celular':'Compu')+' · '+hace(x.hace)+'</div></div>'}).join('')
      :'<div class="vac">Nadie está mirando la app en este momento.</div>'}
  catch(e){document.getElementById('s').textContent='Sin conexión, reintentando…'}}
cargar();setInterval(cargar,10000);
</script></body></html>
